# =============================================================================
# Gitleaks 配置 — sub2api-custom
# =============================================================================
# 策略：在 Gitleaks 默认规则基础上，仅对「上游已知的、刻意为假的测试夹具」
# 做最小化白名单，避免噪音掩盖真实泄露。
#
# 红线：不得为了通过扫描而放宽真实密钥路径。
# 新增白名单必须满足：
#   1. 路径确实只包含刻意的假凭据；
#   2. 在本文件注释中说明依据；
#   3. 在 docs/SECURITY_REVIEW.md 中登记。
# =============================================================================
title = "sub2api-custom gitleaks config"

[extend]
# 使用 Gitleaks 内置默认规则集
useDefault = true

[allowlist]
description = "上游测试夹具与示例配置中的刻意假凭据"

# 仅白名单「具体路径」，不使用宽泛的 *_test.go 通配，
# 以免掩盖真实密钥被误提交到测试文件的情况。
paths = [
  # 上游提供的配置模板：全部为占位值，非真实凭据
  '''^deploy/config\.example\.yaml$''',
  '''^deploy/\.env\.example$''',
  # 部署脚本测试夹具：上游用假二进制与假凭据验证脚本逻辑
  '''^deploy/tests/fixtures/''',
  # 上游测试用固定假密钥/假令牌
  '''^backend/internal/pkg/apicompat/testdata/''',
  '''^backend/internal/service/testdata/''',
]

# 上游测试中大量使用明确的假值前缀，统一放行这些形状
regexes = [
  # 例如 sk-test-..., fake-..., dummy-..., placeholder
  '''(?i)(fake|dummy|placeholder|example|sample|test)[-_]?(secret|token|key|password)''',
  '''(?i)(secret|token|key|password)[-_]?(fake|dummy|placeholder|example|sample|test)''',
  # 明显的零值/重复字符占位
  '''(?i)^(0{16,}|1{16,}|a{16,}|x{16,})$''',
]

# 2026-10-28，Issue #119；owner: agent-coordinator；复核/到期：2026-11-28。
# 仅豁免已逐项重算核验的 20 条真实文件 checksum，来源提交 5b12919213b5bf49865f6c6e6a2678c7edea5da0；不是凭据。
# 固定 manifest 路径 AND 完整 JSON 行中的确切文件路径/固定 checksum；同内容合并提交兼容。
# 任何文件路径或 hash 更新均须重新重算并独立审查，不得泛化；strict 绕过本例外。
[[rules]]
id = "generic-api-key"

