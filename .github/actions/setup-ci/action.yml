name: Prepare CI tools
description: 在 GitHub runner 上补齐 Gitea 作业镜像原有的固定工具
inputs:
  go:
    description: 安装仓库指定的 Go
    default: 'false'
  node:
    description: 安装原版本 pnpm，Node 仍由原校验脚本选择
    default: 'false'
  python:
    description: 安装原有 Python 依赖
    default: 'false'
  lint:
    description: 安装原版本 golangci-lint
    default: 'false'
  gitleaks:
    description: 安装原版本 Gitleaks
    default: 'false'
  govulncheck:
    description: 安装原版本 govulncheck
    default: 'false'
runs:
  using: composite
  steps:
    - if: inputs.go == 'true'
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum
    - if: inputs.node == 'true'
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      with:
        version: 9.15.9
    - if: inputs.python == 'true'
      shell: bash
      run: python3 -m pip install --disable-pip-version-check -r .github/release-tools/requirements-release.txt
    - if: inputs.lint == 'true' || inputs.gitleaks == 'true' || inputs.govulncheck == 'true'
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/ci-bin"
        echo "$RUNNER_TEMP/ci-bin" >> "$GITHUB_PATH"
    - if: inputs.gitleaks == 'true'
      shell: bash
      run: |
        curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
        echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/ci-bin" gitleaks
    - if: inputs.lint == 'true'
      shell: bash
      run: |
        curl -fsSL -o "$RUNNER_TEMP/golangci-lint.tgz" https://github.com/golangci/golangci-lint/releases/download/v2.14.0/golangci-lint-2.14.0-linux-amd64.tar.gz
        echo "ab90aeb7b066f92a33415b638a50fe5344bbb75a0d32ad30cc248d88f81032ab  $RUNNER_TEMP/golangci-lint.tgz" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/golangci-lint.tgz" -C "$RUNNER_TEMP/ci-bin" --strip-components=1 golangci-lint-2.14.0-linux-amd64/golangci-lint
    - if: inputs.govulncheck == 'true'
      shell: bash
      env:
        GOBIN: ${{ runner.temp }}/ci-bin
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
