# rc.1 专用发行：核对已通过的完整 CI 与相同源码树，重新扫描漏洞后构建双架构镜像，
# 冒烟测试通过后才打版本标签，签名并生成来源证明与 SBOM，最后创建 GitHub Release。
# 手动触发可为已存在的 tag 补发镜像；Release 已存在时不覆盖其说明和附件。
name: Release (reuse trusted CI)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本 tag，例如 v0.3.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
      date: ${{ steps.meta.outputs.date }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate tag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || { echo "::error::tag 格式应为 vX.Y.Z 或 vX.Y.Z-<预发布标识>：$TAG"; exit 1; }
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null \
            || { echo "::error::tag 不存在：$TAG"; exit 1; }
          COMMIT="$(git rev-parse "$TAG^{commit}")"
          git merge-base --is-ancestor "$COMMIT" origin/main \
            || { echo "::error::$TAG 指向的提交不在 main 上"; exit 1; }
          VERSION="${TAG#v}"
          FILE_VERSION="$(tr -d '[:space:]' < backend/cmd/server/VERSION)"
          [ "$FILE_VERSION" = "${VERSION%%-*}" ] \
            || { echo "::error::backend/cmd/server/VERSION 为 $FILE_VERSION，与 $TAG 不符"; exit 1; }
          case "$VERSION" in *-*) PRERELEASE=true ;; *) PRERELEASE=false ;; esac
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "commit=$COMMIT"
            echo "date=$(git log -1 --format=%cI "$COMMIT")"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

  ci:
    name: Verify trusted CI evidence
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      evidence: ${{ steps.evidence.outputs.evidence }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout receipt verifier
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: .release-tools
          persist-credentials: false
          sparse-checkout: |
            scripts/verify-release-ci-evidence.py
            scripts/test_verify_release_ci_evidence.py
      - name: Check receipt rejection cases
        run: python3 .release-tools/scripts/test_verify_release_ci_evidence.py
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Refresh source vulnerability scan
        working-directory: backend
        run: |
          set -euo pipefail
          want="go$(awk '$1 == "go" {print $2}' go.mod)"
          go version | grep -q "$want "
          go mod verify
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Verify complete trusted CI and identical source tree
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ needs.prepare.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python3 .release-tools/scripts/verify-release-ci-evidence.py \
            --tag "$SOURCE_TAG" --source-commit "$SOURCE_COMMIT" \
            --out release-ci-evidence.json

  image:
    name: Build and publish image
    needs: [prepare, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Checkout CI scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: .github/scripts
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先只按 Digest 推送，不打任何标签；冒烟测试通过后再打版本标签。
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            DATE=${{ needs.prepare.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=LGPL-3.0
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            index:org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            index:org.opencontainers.image.licenses=LGPL-3.0
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Smoke test
        env:
          IMAGE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE"
          bash .ci-tools/.github/scripts/test-smoke.sh

      - name: Tag image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          tags=(-t "$IMAGE:$VERSION")
          if [ "$PRERELEASE" = false ]; then
            tags+=(-t "$IMAGE:${VERSION%.*}")
            # latest 只跟随语义版本最高的正式版，补发旧版本时不回退 latest。
            highest="$(git ls-remote --tags origin 'v*' | sed -E 's#.*refs/tags/v##; /\^\{\}$/d; /-/d' | sort -V | tail -1)"
            [ "$VERSION" = "$highest" ] && tags+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"

      - name: Bind released source and trusted CI to the image
        env:
          CI_EVIDENCE: ${{ needs.ci.outputs.evidence }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          evidence = json.loads(base64.b64decode(os.environ['CI_EVIDENCE']))
          assert evidence['source_commit'] == os.environ['SOURCE_COMMIT']
          evidence['image_digest'] = os.environ['IMAGE_DIGEST']
          evidence['security_refresh'] = {'tool': 'govulncheck', 'version': 'v1.9.0', 'conclusion': 'success'}
          evidence['publisher_run_url'] = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          Path('dist/release-ci-evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
          cosign attest --yes \
            --type https://github.com/y1yyum/sub2api-custom-public/attestations/release-source/v1 \
            --predicate dist/release-ci-evidence.json "$IMAGE@$IMAGE_DIGEST"

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Export release assets
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            ref="$IMAGE@$DIGEST"
            docker pull -q --platform "linux/$arch" "$ref"
            docker tag "$ref" "sub2api-custom-public:$VERSION"
            docker save "sub2api-custom-public:$VERSION" | gzip -9 > "dist/sub2api-custom-public-v$VERSION-linux-$arch.tar.gz"
            docker rmi -f "sub2api-custom-public:$VERSION" "$ref" >/dev/null
          done
          echo "$IMAGE@$DIGEST" > dist/IMAGE

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: dist/sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: dist/
          retention-days: 30

  release:
    name: GitHub Release
    needs: [prepare, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          DIGEST: ${{ needs.image.outputs.digest }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG 已存在，不覆盖说明和附件。镜像：$IMAGE@$DIGEST"
            exit 0
          fi
          (cd dist && rm -f IMAGE && sha256sum -- * > SHA256SUMS)
          PREV="$(git describe --tags --abbrev=0 --match 'v*.*.*' "$COMMIT^" 2>/dev/null || true)"
          {
            echo "源码 Commit：\`$COMMIT\`"
            echo
            echo "## 镜像"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:$VERSION"
            echo "# 按 Digest 固定（推荐用于生产）"
            echo "docker pull $IMAGE@$DIGEST"
            echo '```'
            echo
            echo "平台：linux/amd64、linux/arm64。镜像已用 Sigstore 无密钥签名，并附带构建来源证明和 SBOM："
            echo
            echo '```bash'
            echo "gh attestation verify oci://$IMAGE@$DIGEST -R $GITHUB_REPOSITORY"
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-identity-regexp '^$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
            echo
            echo "离线部署可下载附件中的镜像包，\`docker load\` 后在 \`deploy/.env\` 设置 \`SUB2API_IMAGE=sub2api-custom-public:$VERSION\`。"
            echo
            echo "## 升级须知"
            echo
            echo "应用启动时自动执行向前数据库迁移，升级前务必备份数据目录与 \`.env\`。"
            if [ -n "$PREV" ]; then
              MIGRATIONS="$(git diff --name-only --diff-filter=A "$PREV" "$COMMIT" -- backend/migrations | awk -F/ '{printf "- \140%s\140\n", $NF}')"
              if [ -n "$MIGRATIONS" ]; then
                echo
                echo "相对 $PREV 新增的迁移："
                echo
                echo "$MIGRATIONS"
              fi
              echo
              echo "## 变更（$PREV → $TAG）"
              echo
              git log --no-merges --format='- %s (%h)' "$PREV..$COMMIT"
            fi
          } > notes.md
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" --verify-tag --title "$TAG" --notes-file notes.md dist/*
