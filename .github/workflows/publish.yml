# 标签全量 Local CI 完成后发布；本工作流不启动或重跑 CI。
name: Publish

on:
  workflow_run:
    workflows: [Local CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 已通过全量 Local CI 的版本标签
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    name: Verify full tag CI
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_repository.full_name == github.repository && startsWith(github.event.workflow_run.head_branch, 'v')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      date: ${{ steps.source.outputs.date }}
      prerelease: ${{ steps.source.outputs.prerelease }}
      published: ${{ steps.source.outputs.published }}
      evidence: ${{ steps.source.outputs.evidence }}
    steps:
      # workflow_run 的控制器来自默认分支，不能从未校验的 CI ref 执行发布脚本。
      - name: Checkout trusted publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the version tag to completed full CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          ARGS=(prepare --tag "$SOURCE_TAG" --out "$RUNNER_TEMP/publication-source.json")
          if [ -n "$TRIGGER_RUN" ]; then ARGS+=(--trigger-run "$TRIGGER_RUN"); fi
          python3 .github/release-tools/ci_evidence.py "${ARGS[@]}"

  security_refresh:
    name: Refresh release vulnerability checks
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          go: 'true'
          node: 'true'
          python: 'true'
          govulncheck: 'true'
      - name: Verify Go toolchain
        run: |
          want="go$(awk '$1 == "go" {print $2}' backend/go.mod)"
          go version | grep -q "$want "
      - name: Refresh govulncheck
        working-directory: backend
        shell: bash
        run: |
          set -uo pipefail
          govulncheck ./... 2>&1 | tee "$RUNNER_TEMP/publish-govulncheck.txt"
          rc=${PIPESTATUS[0]}
          if grep -qE '^panic:|unexpected expr|cannot decode|export data version' "$RUNNER_TEMP/publish-govulncheck.txt"; then exit 1; fi
          test "$rc" -eq 0 || exit 1
          grep -qE 'No vulnerabilities found|Your code is affected by [0-9]+ vulnerabilit|Vulnerability #' "$RUNNER_TEMP/publish-govulncheck.txt"
      - name: Select checksum-pinned Node
        run: python3 .gitea/setup-ci-node.py
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: |
          pnpm --version | grep -qx '9.15.9'
          pnpm install --frozen-lockfile
      - name: Refresh npm vulnerability data
        working-directory: frontend
        run: |
          pnpm audit --prod --audit-level=high --json > audit.json || true
          pnpm audit --audit-level=high --json > audit-full.json || true
      - name: Apply the existing audit policy
        run: |
          python3 tools/check_pnpm_audit_exceptions.py --audit frontend/audit.json --exceptions .github/audit-exceptions.yml
          python3 scripts/audit-gate.py --prod frontend/audit.json --full frontend/audit-full.json --exceptions .github/audit-exceptions.yml --baseline .github/audit-baseline-devdeps.json

  image:
    name: Build and publish image
    needs: [prepare, security_refresh]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - name: Checkout CI scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: .github/scripts
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先只按 Digest 推送，不打任何标签；冒烟测试通过后再打版本标签。
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            COMMIT=${{ needs.prepare.outputs.commit }}
            DATE=${{ needs.prepare.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=LGPL-3.0
          annotations: |
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ needs.prepare.outputs.commit }}
            index:org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            index:org.opencontainers.image.licenses=LGPL-3.0
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release
          cache-to: type=gha,scope=release,mode=max

      - name: Smoke test
        env:
          IMAGE: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE"
          bash .ci-tools/.github/scripts/test-smoke.sh

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image
        run: cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"

      - name: Bind released source and trusted CI to the image
        env:
          CI_EVIDENCE: ${{ needs.prepare.outputs.evidence }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          mkdir -p dist
          python3 - <<'PY'
          import base64, json, os
          from pathlib import Path
          evidence = json.loads(base64.b64decode(os.environ['CI_EVIDENCE']))
          assert evidence['source_commit'] == os.environ['SOURCE_COMMIT']
          evidence['image_digest'] = os.environ['IMAGE_DIGEST']
          evidence['security_refresh'] = {'govulncheck': 'success', 'pnpm_audit': 'success'}
          evidence['publisher_run_url'] = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          Path('dist/release-ci-evidence.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
          cosign attest --yes \
            --type https://github.com/y1yyum/sub2api-custom-public/attestations/release-source/v1 \
            --predicate dist/release-ci-evidence.json "$IMAGE@$IMAGE_DIGEST"

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Export release assets
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            ref="$IMAGE@$DIGEST"
            docker pull -q --platform "linux/$arch" "$ref"
            docker tag "$ref" "sub2api-custom-public:$VERSION"
            docker save "sub2api-custom-public:$VERSION" | gzip -9 > "dist/sub2api-custom-public-v$VERSION-linux-$arch.tar.gz"
            docker rmi -f "sub2api-custom-public:$VERSION" "$ref" >/dev/null
          done
          echo "$IMAGE@$DIGEST" > dist/IMAGE

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: dist/sbom.cdx.json

      - name: Tag image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          tags=(-t "$IMAGE:$VERSION")
          if [ "$PRERELEASE" = false ]; then
            tags+=(-t "$IMAGE:${VERSION%.*}")
            # latest 只跟随语义版本最高的正式版，补发旧版本时不回退 latest。
            highest="$(git ls-remote --tags origin 'v*' | sed -E 's#.*refs/tags/v##; /\^\{\}$/d; /-/d' | sort -V | tail -1)"
            [ "$VERSION" = "$highest" ] && tags+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          path: dist/
          retention-days: 30

  release:
    name: GitHub Release
    needs: [prepare, image]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          COMMIT: ${{ needs.prepare.outputs.commit }}
          DIGEST: ${{ needs.image.outputs.digest }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG 已存在，不覆盖说明和附件。镜像：$IMAGE@$DIGEST"
            exit 0
          fi
          (cd dist && rm -f IMAGE && sha256sum -- * > SHA256SUMS)
          IDENTITY="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/publish.yml@$GITHUB_REF"
          PREV="$(git describe --tags --abbrev=0 --match 'v*.*.*' "$COMMIT^" 2>/dev/null || true)"
          {
            echo "源码 Commit：\`$COMMIT\`"
            echo
            echo '测试范围为当前公开仓库保留的全部测试。Local CI 来源与源码绑定见 release-ci-evidence.json。'
            echo '该证据单独签名并绑定到镜像 Digest；GitHub 构建来源证明标识发布工作流提交。'
            echo
            echo "## 镜像"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:$VERSION"
            echo "# 按 Digest 固定（推荐用于生产）"
            echo "docker pull $IMAGE@$DIGEST"
            echo '```'
            echo
            echo "平台：linux/amd64、linux/arm64。镜像已用 Sigstore 无密钥签名，并附带构建来源证明和 SBOM："
            echo
            echo '```bash'
            echo "gh attestation verify oci://$IMAGE@$DIGEST -R $GITHUB_REPOSITORY"
            echo "cosign verify $IMAGE@$DIGEST \\"
            echo "  --certificate-identity '$IDENTITY' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo
            echo "cosign verify-attestation --type https://github.com/y1yyum/sub2api-custom-public/attestations/release-source/v1 \\"
            echo "  --certificate-identity '$IDENTITY' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com $IMAGE@$DIGEST"
            echo '```'
            echo
            echo "离线部署可下载附件中的镜像包，\`docker load\` 后在 \`deploy/.env\` 设置 \`SUB2API_IMAGE=sub2api-custom-public:$VERSION\`。"
            echo
            echo "## 升级须知"
            echo
            echo "应用启动时自动执行向前数据库迁移，升级前务必备份数据目录与 \`.env\`。"
            if [ -n "$PREV" ]; then
              MIGRATIONS="$(git diff --name-only --diff-filter=A "$PREV" "$COMMIT" -- backend/migrations | awk -F/ '{printf "- \140%s\140\n", $NF}')"
              if [ -n "$MIGRATIONS" ]; then
                echo
                echo "相对 $PREV 新增的迁移："
                echo
                echo "$MIGRATIONS"
              fi
              echo
              echo "## 变更（$PREV → $TAG）"
              echo
              git log --no-merges --format='- %s (%h)' "$PREV..$COMMIT"
            fi
          } > notes.md
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$TAG" "${flags[@]}" --verify-tag --title "$TAG" --notes-file notes.md dist/*
