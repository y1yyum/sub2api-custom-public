# CI：后端编译与漏洞扫描、前端类型检查与构建、镜像冒烟测试。
# 也被 release.yml 以 workflow_call 复用，保证发布的 tag 通过同一套检查。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: 要检查的 ref
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Verify Go toolchain
        run: |
          want="go$(awk '$1 == "go" {print $2}' go.mod)"
          go version | grep -q "$want " || { echo "::error::Go 版本应为 $want"; go version; exit 1; }
      - run: go mod verify
      - run: go vet ./...
      - run: go build ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

  image:
    name: Image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Checkout CI scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: .ci-tools
          sparse-checkout: .github/scripts
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: sub2api-custom-public:ci
          build-args: |
            COMMIT=${{ inputs.ref || github.sha }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,scope=image-amd64,mode=max
      - name: Smoke test
        env:
          IMAGE: sub2api-custom-public:ci
        run: bash .ci-tools/.github/scripts/test-smoke.sh

  upgrade-preservation:
    name: Custom upgrade safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: python3 .github/scripts/test-upgrade-preservation.py

  backend-regression:
    name: Backend regression (${{ matrix.tags }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tags: [unit, integration]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Restore pinned test dependency closure onto this checkout
        run: python3 .github/scripts/prepare-upgrade-validation.py "$RUNNER_TEMP/upgrade-validation"
      - name: Test (race detector enabled)
        working-directory: ${{ runner.temp }}/upgrade-validation/backend
        env:
          GOMAXPROCS: '2'
          GOGC: '30'
        run: go test -p 1 -race -count=1 -tags=${{ matrix.tags }} -timeout=20m ./...

  frontend-regression:
    name: Frontend regression (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Restore pinned test dependency closure onto this checkout
        run: python3 .github/scripts/prepare-upgrade-validation.py "$RUNNER_TEMP/upgrade-validation"
      - name: Install locked dependencies
        working-directory: ${{ runner.temp }}/upgrade-validation/frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: ${{ runner.temp }}/upgrade-validation/frontend
        run: pnpm run lint:check
      - name: Typecheck
        working-directory: ${{ runner.temp }}/upgrade-validation/frontend
        run: pnpm run typecheck
      - name: Vitest
        working-directory: ${{ runner.temp }}/upgrade-validation/frontend
        run: pnpm run test:run
      - name: Production build
        working-directory: ${{ runner.temp }}/upgrade-validation/frontend
        run: pnpm run build
